name: purple-talent

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: purple
      POSTGRES_USER: purple
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - database:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U purple -d purple']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    cpus: 1
    security_opt: [no-new-privileges:true]

  api:
    build: ./api
    command: [sh, -c, 'npm run db:deploy && npm start']
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://purple:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@db:5432/purple?schema=public
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8088}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Defina DEMO_PASSWORD com pelo menos 12 caracteres}
      LAB_FLAG: ${LAB_FLAG:?Defina LAB_FLAG com pelo menos 12 caracteres}
    depends_on:
      db:
        condition: service_healthy
    networks: [app, data]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1

  web:
    build: ./web
    networks: [app]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5

  gateway:
    image: nginx:1.28-alpine
    user: nginx
    ports: ['127.0.0.1:8088:8080']
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [web, api]
    networks: [app]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5

  lab:
    profiles: [labs]
    build: ./labs/access-review
    environment:
      LAB_FLAG: ${LAB_FLAG:?Defina LAB_FLAG com pelo menos 12 caracteres}
    ports: ['127.0.0.1:8091:8091']
    networks: [lab]
    user: node
    read_only: true
    tmpfs: [/tmp:size=16m,noexec,nosuid]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5

networks:
  app: {}
  data:
    internal: true
  lab:
    internal: true

volumes:
  database: {}
